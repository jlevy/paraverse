# ---- Project Info and Dependencies ----

[project]
name = "paraverse-graph"
description = "Load the conference softschema knowledge base into FalkorDB and query it."
authors = [
    { name="Joshua Levy" },
]
readme = "README.md"
# FalkorDBLite (the embedded server used for local runs and tests) needs 3.12+.
requires-python = ">=3.12,<4.0"
dynamic = ["version"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    # This package is not published to PyPI. This classifier makes PyPI reject an
    # accidental upload.
    "Private :: Do Not Upload",
]


# ---- Main dependencies ----

dependencies = [
    "falkordb>=1.7.1,<2",
    "falkordblite>=0.10.0,<0.12",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "rich-argparse>=1.7.1",
    "softschema==0.8.1",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
    "watchfiles>=1.2.0",
]


# ---- Dev dependencies ----

[dependency-groups]
build = [
    "hatchling==1.31.0",
    "uv-dynamic-versioning==0.14.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "codespell>=2.4.3",
    "basedpyright>=1.39.9",
    "funlog>=0.2.1",
    "types-pyyaml>=6.0.12",
    "httpx2>=0.1",
]

[project.scripts]
paraverse-graph = "paraverse_graph.cli:main"


# ---- Build system ----

[build-system]
requires = ["hatchling==1.31.0", "uv-dynamic-versioning==0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/paraverse_graph"]


# ---- Tool Settings ----

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "SIM", "RUF"]
ignore = [
    "E501",
    "E402",
    "E731",
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC002",
]

[tool.basedpyright]
include = ["src", "tests", "devtools"]
reportIgnoreCommentWithoutRule = false
reportUnnecessaryTypeIgnoreComment = false
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportImplicitStringConcatenation = false
reportUnreachable = false
# The falkordb and redislite clients ship without complete type information.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeArgument = false

[tool.codespell]
ignore-words-list = "ser,retuned,retunes,alledges"

[tool.pytest.ini_options]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = [
    "src",
    "tests",
]
norecursedirs = []
filterwarnings = []
